[package]
name = "Space_Game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.1", features = ["serialize", "jpeg"] }
bevy_egui = "0.39.1"
serde = { version = "1.0.228", features = ["derive"] }
ron = "0.12"

# Once optimized to avoid miserable speeds 
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
